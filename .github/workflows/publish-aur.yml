name: Publish AUR

# Updates synthmultiviewer-appimage on the AUR from a published GitHub Release.
# The Linux AppImage must already be attached to that release (Publish workflow).
#
# Required repository secret:
#   AUR_SSH_PRIVATE_KEY — private key whose public half is on your AUR account
# Optional repository secrets:
#   AUR_EMAIL — defaults to mysteryx93@protonmail.com
# Git commits use AUR username Hanuman.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (empty = latest GitHub release)
        required: false
        type: string
      pkgrel:
        description: AUR pkgrel
        required: false
        type: string
        default: '1'

concurrency:
  group: publish-aur-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aur-publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_TAG:-}" ]]; then
            version="$RELEASE_TAG"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="$INPUT_VERSION"
          else
            version=$(gh release view --json tagName --jq .tagName)
          fi

          version="${version#v}"
          [[ -n "$version" ]] || { echo "::error::Could not resolve a release version."; exit 1; }

          pkgrel="${INPUT_PKGREL:-1}"
          [[ "$pkgrel" =~ ^[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::pkgrel must be a number such as 1 or 1.1: $pkgrel"
            exit 1
          }

          release_base="https://github.com/${{ github.repository }}/releases/download/v${version}"
          asset_x64="SynthMultiViewer-${version}_Linux_x64.AppImage"
          asset_arm="SynthMultiViewer-${version}_Linux_arm64.AppImage"
          url_x64="${release_base}/${asset_x64}"
          url_arm="${release_base}/${asset_arm}"
          curl -fsILo /dev/null "$url_x64" || {
            echo "::error::Release asset not found: $url_x64"
            echo "Publish a GitHub Release that includes the Linux x64 AppImage first."
            exit 1
          }
          curl -fsILo /dev/null "$url_arm" || {
            echo "::error::Release asset not found: $url_arm"
            echo "Publish a GitHub Release that includes the Linux arm64 AppImage first."
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          echo "pkgrel: $pkgrel"

      - name: Update PKGBUILD
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PKGREL: ${{ steps.meta.outputs.pkgrel }}
        run: |
          set -euo pipefail
          pkgbuild=aur/PKGBUILD
          [[ -f "$pkgbuild" ]] || { echo "::error::Missing $pkgbuild"; exit 1; }
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "$pkgbuild"
          sed -i "s/^pkgrel=.*/pkgrel=${PKGREL}/" "$pkgbuild"
          echo "Updated PKGBUILD:"
          grep -E '^(pkgver|pkgrel)=' "$pkgbuild"

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: synthmultiviewer-appimage
          pkgbuild: ./aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: ${{ secrets.AUR_USERNAME || 'Hanuman' }}
          commit_email: ${{ secrets.AUR_EMAIL || 'mysteryx93@protonmail.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.pkgrel }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
